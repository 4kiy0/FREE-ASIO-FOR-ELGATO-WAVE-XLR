name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item build/Release/WaveXlrAsio.dll, install.bat, uninstall.bat, INSTALL.txt, README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath WaveXlrAsio-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WaveXlrAsio-x64
          path: WaveXlrAsio-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: ${{ github.ref_name }} (pre-release)
          files: WaveXlrAsio-x64.zip
          body: |
            First public build. Tested on very few setups so far: please report results and attach `%APPDATA%\WaveXLR-ASIO\log.txt`.

            Install:
            1. Close Wave Link.
            2. `mmsys.cpl` > Wave XLR (Playback and Recording) > Properties > Advanced: allow exclusive control, 48000 Hz.
            3. Unzip, right-click `install.bat` > Run as administrator.
            4. REAPER > Preferences > Audio > Device > ASIO > "Wave XLR MK2 ASIO".

            See the README for settings and troubleshooting.
